[package]
name = "claude-session-manager"
version = "0.1.0"
description = "Cross-platform desktop app to manage Claude sessions and git workflows"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "claude_session_manager_lib"
path = "src/lib.rs"

[[bin]]
name = "claude-session-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["shell-open"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.30", features = ["bundled"] }
chrono = "0.4"
walkdir = "2"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
